name: build

on:
  pull_request: {}
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_call: {}

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  jvm-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: darwin-aarch64
          - os: macos-15-intel
            platform: darwin-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build native library
        run: scripts/build-jvm-native.sh

      # Runs the tests against this platform's library, with CheckJNI.
      - run: ./gradlew :quickjs:jvm:build

      - uses: actions/upload-artifact@v7
        with:
          name: jvm-native-${{ matrix.platform }}
          path: quickjs/jvm/src/main/resources/
          if-no-files-found: error

  jvm:
    runs-on: ubuntu-24.04
    needs: jvm-native

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: actions/download-artifact@v8
        with:
          pattern: jvm-native-*
          path: quickjs/jvm/src/main/resources/
          merge-multiple: true

      - run: ./gradlew :quickjs:jvm:assemble :quickjs:jvm:generatePomFileForMavenPublication

      - name: Check that the JAR contains every platform
        run: |
          jar=$(ls quickjs/jvm/build/libs/quickjs-jvm-*.jar | grep -v -e sources -e javadoc)
          for platform in linux-x86_64/libquickjs.so linux-aarch64/libquickjs.so \
              darwin-aarch64/libquickjs.dylib darwin-x86_64/libquickjs.dylib; do
            unzip -l "$jar" | grep -q " $platform$" || { echo "Missing $platform in $jar"; exit 1; }
          done
          cp quickjs/jvm/build/publications/maven/pom-default.xml \
            "quickjs/jvm/build/libs/$(basename "$jar" .jar).pom"

      - uses: actions/upload-artifact@v7
        with:
          name: quickjs-jvm
          path: quickjs/jvm/build/libs/
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      # `build` includes lint and the 16 KB alignment check of the release AAR.
      - run: ./gradlew build assembleDebugAndroidTest generatePomFileForReleasePublication
        working-directory: quickjs-android

      - name: Check the test APK for 16 KB devices
        run: scripts/check-elf-alignment.sh quickjs-android/build/outputs/apk/androidTest/debug/*.apk

      - name: Collect release files
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          mkdir -p build/android
          cp quickjs-android/build/outputs/aar/quickjs-android-release.aar \
            "build/android/quickjs-android-$version.aar"
          cp quickjs-android/build/publications/release/pom-default.xml \
            "build/android/quickjs-android-$version.pom"

      - uses: actions/upload-artifact@v7
        with:
          name: quickjs-android
          path: build/android/
          if-no-files-found: error

  android-device:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum supported API level. It has no getconf to check the page size.
          - api-level: 21
            target: default
            page-size: ''
          # A device with 16 KB pages.
          - api-level: 35
            target: google_apis_ps16k
            page-size: 16384

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          working-directory: quickjs-android
          script: |
            if [ -n "${{ matrix.page-size }}" ]; then test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "${{ matrix.page-size }}"; fi
            ./gradlew connectedDebugAndroidTest :minify-test:connectedMinifiedAndroidTest
            ../scripts/print-test-failures.py build/outputs/androidTest-results
            ../scripts/print-test-failures.py minify-test/build/outputs/androidTest-results

      - name: Show failed tests
        if: failure()
        run: |
          scripts/print-test-failures.py quickjs-android/build/outputs/androidTest-results || true
          scripts/print-test-failures.py quickjs-android/minify-test/build/outputs/androidTest-results || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-results-${{ matrix.api-level }}
          path: |
            quickjs-android/build/reports/androidTests/
            quickjs-android/build/outputs/androidTest-results/
            quickjs-android/minify-test/build/reports/androidTests/
            quickjs-android/minify-test/build/outputs/androidTest-results/
