name: release

on:
  push:
    tags:
      # Only this fork's releases, not the tags inherited from upstream.
      - '*-16kb.*'

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-release-version.sh "${{ github.ref_name }}"

  build:
    needs: check-version
    uses: ./.github/workflows/build.yaml

  release:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: quickjs-*
          path: release/
          merge-multiple: true

      - name: Check the release files
        run: |
          scripts/check-release-version.sh "${{ github.ref_name }}" release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: ffurrer2/extract-release-notes@v3
        id: release_notes

      # A draft, so the release can be reviewed before it is published.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body: ${{ steps.release_notes.outputs.release_notes }}
          files: release/*
