name: release

on:
  push:
    tags:
      # Only this fork's releases, not the tags inherited from upstream.
      - '*-16kb.*'

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-release-version.sh "${{ github.ref_name }}"

  build:
    needs: check-version
    uses: ./.github/workflows/build.yaml

  release:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quickjs-*
          path: release/
          merge-multiple: true

      - name: Check the release files
        run: |
          scripts/check-release-version.sh "${{ github.ref_name }}" release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        id: release_notes

      # A draft, so the release can be reviewed before it is published.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          body: ${{ steps.release_notes.outputs.release_notes }}
          files: release/*
