// No longer built: this sample needs the Android Gradle Plugin 4.2 setup that the root project
// dropped. Kept for reference only.

apply plugin: 'com.android.application'

android {
  compileSdkVersion rootProject.ext.compileSdkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  defaultConfig {
    applicationId 'com.example.duktape.octane'
    minSdkVersion 18
    targetSdkVersion 29
  }

  signingConfigs {
    samples {
      storeFile file('samples.keystore')
      storePassword 'javascript'
      keyAlias 'javascript'
      keyPassword 'javascript'
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      signingConfig signingConfigs.samples
    }
    release {
      signingConfig signingConfigs.samples
    }
  }
}

dependencies {
  implementation project(':quickjs:android')
  implementation deps.duktape
  implementation deps.okio
}
